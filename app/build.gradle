plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patricktinkam.firsteditioncompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.patricktinkam.firsteditioncompanion'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
