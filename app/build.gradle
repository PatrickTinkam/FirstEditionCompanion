plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patricktinkam.firsteditioncompanion'
    compileSdk 35

    signingConfigs {
        stablePrototype {
            def prototypeKeystore = rootProject.file('ci/fec-prototype.keystore')
            if (prototypeKeystore.exists()) {
                storeFile prototypeKeystore
                storePassword ('first' + 'edition' + 'companion')
                keyAlias 'fecprototype'
                keyPassword ('first' + 'edition' + 'companion')
            }
        }
    }

    defaultConfig {
        applicationId 'com.patricktinkam.firsteditioncompanion'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.9.6-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            if (rootProject.file('ci/fec-prototype.keystore').exists()) {
                signingConfig signingConfigs.stablePrototype
            }
        }
        release {
            minifyEnabled false
        }
    }
}
