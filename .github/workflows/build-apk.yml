name: Build First Edition Companion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out releases
          cp app/build/outputs/apk/debug/app-debug.apk out/FirstEditionCompanion-v0.3.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk releases/FirstEditionCompanion-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FirstEditionCompanion-v0.3.0
          path: out/FirstEditionCompanion-v0.3.0.apk
      - name: Publish APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/FirstEditionCompanion-v0.3.0.apk
          if git diff --cached --quiet; then
            echo "Repository APK already matches this build."
            exit 0
          fi
          git commit -m "Publish First Edition Companion v0.3.0 APK [skip ci]"
          git push
