name: Build First Edition Companion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FirstEditionCompanion-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FirstEditionCompanion-v0.3.0
          path: out/FirstEditionCompanion-v0.3.0.apk
