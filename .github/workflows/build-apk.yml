name: Build First Edition Companion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi
          VERSION="${VERSION_NAME%-prototype}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=FirstEditionCompanion-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare stable prototype signing key
        shell: bash
        run: |
          base64 --decode ci/fec-prototype.keystore.b64 > ci/fec-prototype.keystore
          chmod 600 ci/fec-prototype.keystore
          keytool -list -keystore ci/fec-prototype.keystore -storepass firsteditioncompanion -alias fecprototype >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out releases
          cp app/build/outputs/apk/debug/app-debug.apk "out/${{ steps.version.outputs.apk }}"
          cp app/build/outputs/apk/debug/app-debug.apk "releases/${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FirstEditionCompanion-${{ steps.version.outputs.tag }}
          path: out/${{ steps.version.outputs.apk }}

      - name: Publish APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/${{ steps.version.outputs.apk }}"
          if git diff --cached --quiet; then
            echo "Repository APK already matches this build."
          else
            git commit -m "Publish First Edition Companion ${{ steps.version.outputs.tag }} APK [skip ci]"
            git push
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          TITLE="First Edition Companion $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$APK" --clobber
            if [ -f RELEASE_NOTES.md ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
            else
              gh release edit "$TAG" --title "$TITLE" --latest
            fi
          else
            if [ -f RELEASE_NOTES.md ]; then
              gh release create "$TAG" "out/$APK" --title "$TITLE" --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md --latest
            else
              gh release create "$TAG" "out/$APK" --title "$TITLE" --target "$GITHUB_SHA" --generate-notes --latest
            fi
          fi
